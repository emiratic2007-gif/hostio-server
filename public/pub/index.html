<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DownTown pub · Rezervacija stola</title>
<meta name="description" content="Rezervišite sto u DownTown pubu za petak 30.10. ili subotu 31.10. u dva koraka.">
<meta name="theme-color" content="#140D0A">
<meta property="og:title" content="DownTown pub · Rezervišite sto">
<meta property="og:description" content="Petak 30.10. ili subota 31.10. Dva koraka i sto je vaš.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23140D0A'/%3E%3Cpath d='M18 18h22v30a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4z' fill='%23F2A93B'/%3E%3Cpath d='M16 14h26v8H16z' fill='%23FFF4DC'/%3E%3Cpath d='M40 24h5a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5h-5' fill='none' stroke='%23F2A93B' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#140D0A;--brick:#2A1610;--wood:#3B2216;--wood2:#4A2C1C;--amber:#F2A93B;--amber2:#FFC766;--foam:#FFF4DC;--cream:#E9DCC3;--mut:#B39C83;--neon:#FF5A3C;--ok:#7BD88F;--line:rgba(255,244,220,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--foam);background:var(--bg);-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(70% 45% at 50% 0%,rgba(242,169,59,.22),transparent 70%),
    linear-gradient(rgba(20,13,10,.82),rgba(20,13,10,.94)),
    repeating-linear-gradient(0deg,transparent 0 30px,rgba(0,0,0,.55) 30px 33px),
    repeating-linear-gradient(90deg,transparent 0 62px,rgba(0,0,0,.55) 62px 65px),
    linear-gradient(#5A2A1C,#3A1A12);
  background-attachment:fixed}
.wrap{width:min(460px,100% - 32px);margin:0 auto;padding:28px 0 40px;min-height:100svh;display:flex;flex-direction:column}
header{text-align:center;padding:10px 0 22px}
.since{display:inline-flex;align-items:center;gap:10px;font-family:Oswald,sans-serif;font-size:.78rem;letter-spacing:.34em;color:var(--mut);text-transform:uppercase}
.since::before,.since::after{content:"";width:28px;height:1px;background:var(--mut);opacity:.6}
.neon{font-family:Yellowtail,cursive;font-size:clamp(3.4rem,17vw,4.6rem);line-height:1;color:#FFE7C2;margin:8px 0 2px;
  text-shadow:0 0 6px rgba(255,199,102,.9),0 0 18px rgba(242,169,59,.8),0 0 42px rgba(255,90,60,.55),0 0 80px rgba(255,90,60,.35);animation:flick 6s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.7}97%{opacity:1}}
.pub{font-family:Oswald,sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:.55em;padding-left:.55em;color:var(--amber);text-transform:uppercase}
.card{position:relative;background:linear-gradient(170deg,var(--wood2),var(--wood) 55%,#2E1A10);border-radius:22px;padding:22px 20px 22px;
  box-shadow:0 30px 60px -25px #000,inset 0 1px 0 rgba(255,244,220,.12),inset 0 0 0 1px rgba(255,244,220,.06);overflow:hidden}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.25;
  background:repeating-linear-gradient(178deg,transparent 0 9px,rgba(0,0,0,.25) 9px 10px,transparent 10px 23px,rgba(255,220,180,.06) 23px 24px)}
.card>*{position:relative}
.steps{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-family:Oswald,sans-serif;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.steps i{flex:1;height:2px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--amber);transform:scaleX(var(--p,0));transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.steps b{color:var(--amber2);font-weight:600}
h2{font-family:Oswald,sans-serif;font-weight:600;font-size:1.55rem;letter-spacing:.02em;text-transform:uppercase;line-height:1.1;margin-bottom:14px}
.lbl{display:block;font-family:Oswald,sans-serif;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin:18px 0 10px}
.days{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.day{position:relative;border:0;cursor:pointer;text-align:center;padding:16px 10px 14px;border-radius:16px;color:var(--bg);font-family:Oswald,sans-serif;
  background:var(--cream);box-shadow:0 10px 0 -4px rgba(0,0,0,.35);transition:transform .2s,background .2s,box-shadow .2s;
  -webkit-mask:radial-gradient(circle 9px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
.day small{display:block;font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;opacity:.7}
.day strong{display:block;font-size:2.3rem;font-weight:700;line-height:1.05;margin-top:2px}
.day em{display:block;font-style:normal;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;margin-top:4px;opacity:.75}
.day[aria-pressed="true"]{background:var(--amber);transform:translateY(-3px) rotate(-1.2deg);box-shadow:0 14px 26px -10px rgba(242,169,59,.7)}
.day:nth-child(2)[aria-pressed="true"]{transform:translateY(-3px) rotate(1.2deg)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px;border-radius:16px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px var(--line)}
.stepper button{width:52px;height:52px;border-radius:14px;border:0;cursor:pointer;background:rgba(255,244,220,.08);color:var(--foam);font-size:1.6rem;line-height:1;transition:background .2s}
.stepper button:hover{background:rgba(242,169,59,.25)}
.stepper button:disabled{opacity:.3;cursor:default}
.count{text-align:center;font-family:Oswald,sans-serif}
.count strong{display:block;font-size:2.2rem;font-weight:700;line-height:1;color:var(--amber2)}
.count span{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.mugs{display:flex;justify-content:center;gap:4px;min-height:22px;margin-top:10px;flex-wrap:wrap}
.mugs svg{width:18px;height:22px;animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0) translateY(6px)}to{transform:none}}
.field{display:block;margin-top:12px}
.field input{width:100%;height:56px;border-radius:14px;border:0;padding:0 16px;font:500 1.05rem Inter,sans-serif;color:var(--foam);background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1.5px var(--line);outline:none;transition:box-shadow .2s}
.field input::placeholder{color:#8E7A66}
.field input:focus{box-shadow:inset 0 0 0 2px var(--amber)}
.summary{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(242,169,59,.12);box-shadow:inset 0 0 0 1px rgba(242,169,59,.35);font-size:.95rem}
.summary svg{width:22px;height:22px;flex:none;color:var(--amber)}
.summary b{color:var(--amber2)}
.summary button{margin-left:auto;border:0;background:none;color:var(--mut);font:600 .8rem Inter,sans-serif;text-decoration:underline;cursor:pointer}
.cta{margin-top:20px;width:100%;height:60px;border:0;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  font:700 1.15rem Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);background:linear-gradient(180deg,var(--amber2),var(--amber));
  box-shadow:0 8px 0 -2px #A8641A,0 18px 30px -12px rgba(242,169,59,.6);transition:transform .15s,box-shadow .15s,opacity .2s}
.cta:active{transform:translateY(3px);box-shadow:0 4px 0 -2px #A8641A}
.cta:disabled{opacity:.45;cursor:default;transform:none}
.cta svg{width:20px;height:20px}
.err{min-height:20px;margin-top:10px;font-size:.88rem;color:#FF9A85;text-align:center}
.panel{animation:in .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}
.done{text-align:center;padding:10px 0 4px}
.done .glass{width:96px;height:118px;margin:0 auto 14px;display:block}
.done .glass .beer{transform-origin:50% 100%;animation:fill 1.4s cubic-bezier(.2,.8,.2,1) .15s both}
@keyframes fill{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.done h2{font-size:1.9rem;margin-bottom:8px}
.done p{color:var(--cream);line-height:1.5}
.ticket{margin:18px auto 0;max-width:300px;padding:16px;border-radius:14px;background:var(--cream);color:var(--bg);font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.08em}
.ticket div{display:flex;justify-content:space-between;padding:4px 0;font-size:.95rem}
.ticket div+div{border-top:1px dashed rgba(20,13,10,.3)}
.ticket b{font-weight:700}
footer{margin-top:auto;padding-top:26px;text-align:center;font-size:.74rem;color:#8E7A66;letter-spacing:.06em}
footer a{color:#8E7A66}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="since">Rezervacija stola</div>
    <div class="neon">DownTown</div>
    <div class="pub">Pub</div>
  </header>

  <section class="card" aria-live="polite">
    <div class="steps" id="steps"><span>Korak <b id="stepN">1</b> / 2</span><i id="bar" style="--p:.5"></i></div>

    <!-- STEP 1 -->
    <div class="panel" id="s1">
      <h2>Kad dolazite?</h2>
      <div class="days" role="group" aria-label="Dan">
        <button type="button" class="day" data-day="2026-10-30" aria-pressed="false"><small>Petak</small><strong>30.10.</strong></button>
        <button type="button" class="day" data-day="2026-10-31" aria-pressed="false"><small>Subota</small><strong>31.10.</strong></button>
      </div>
      <span class="lbl">Broj osoba</span>
      <div class="stepper">
        <button type="button" id="minus" aria-label="Manje osoba">−</button>
        <div class="count"><strong id="guests">2</strong><span id="guestsLbl">osobe</span></div>
        <button type="button" id="plus" aria-label="Više osoba">+</button>
      </div>
      <div class="mugs" id="mugs" aria-hidden="true"></div>
      <button type="button" class="cta" id="next" disabled>Dalje <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>

    <!-- STEP 2 -->
    <form class="panel" id="s2" hidden novalidate>
      <h2>Na čije ime?</h2>
      <div class="summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span id="sum"></span><button type="button" id="back">Promijeni</button></div>
      <label class="field"><input id="fn" name="fn" autocomplete="given-name" placeholder="Ime" maxlength="60" required></label>
      <label class="field"><input id="ln" name="ln" autocomplete="family-name" placeholder="Prezime" maxlength="60" required></label>
      <input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">
      <button type="submit" class="cta" id="send">Rezerviši sto <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
      <p class="err" id="err" role="status"></p>
    </form>

    <!-- DONE -->
    <div class="panel done" id="s3" hidden>
      <svg class="glass" viewBox="0 0 96 118" aria-hidden="true">
        <defs><clipPath id="gc"><path d="M14 18h56l-4 88a8 8 0 0 1-8 7H26a8 8 0 0 1-8-7z"/></clipPath></defs>
        <g clip-path="url(#gc)"><rect class="beer" x="10" y="30" width="64" height="86" fill="#F2A93B"/></g>
        <path d="M12 26c0-10 8-14 14-12 4-8 16-8 20-2 6-6 18-2 18 6 6 0 10 4 8 10H12z" fill="#FFF4DC"/>
        <path d="M14 18h56l-4 88a8 8 0 0 1-8 7H26a8 8 0 0 1-8-7z" fill="none" stroke="#FFF4DC" stroke-width="3"/>
        <path d="M70 40h8a8 8 0 0 1 8 8v20a8 8 0 0 1-8 8h-10" fill="none" stroke="#FFF4DC" stroke-width="5"/>
      </svg>
      <h2>Vidimo se!</h2>
      <p>Sto je rezervisan. Samo recite ime na ulazu.</p>
      <div class="ticket" id="ticket"></div>
    </div>
  </section>

  <footer>DownTown pub · rezervacije preko <a href="https://hostio.ba/" target="_blank" rel="noopener">Hostio</a></footer>
</main>

<script>
(() => {
"use strict";
const SB_URL = "https://eauwnwvieyepzrbildqt.supabase.co";
const SB_KEY = "sb_publishable_iQCs2n49JzTcJyrPadZIiw_xXSI4Qh_";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const DAYS = { "2026-10-30": "Petak 30.10.", "2026-10-31": "Subota 31.10." };
let day = null, guests = 2;
const MAX = 20;
const osoba = n => (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? "osobe" : "osoba";
const MUG = '<svg viewBox="0 0 18 22"><path d="M2 4h10v15a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="#F2A93B"/><path d="M1.5 3.5h11v3h-11z" fill="#FFF4DC"/><path d="M12 8h2a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2" fill="none" stroke="#F2A93B" stroke-width="1.6"/></svg>';
function renderGuests() {
  $("#guests").textContent = guests; $("#guestsLbl").textContent = osoba(guests);
  $("#minus").disabled = guests <= 1; $("#plus").disabled = guests >= MAX;
  $("#mugs").innerHTML = MUG.repeat(Math.min(guests, 12)) + (guests > 12 ? `<span style="font:600 .8rem Oswald;color:#B39C83;align-self:center">+${guests - 12}</span>` : "");
}
$$(".day").forEach(b => b.addEventListener("click", () => {
  day = b.dataset.day; $$(".day").forEach(x => x.setAttribute("aria-pressed", x === b)); $("#next").disabled = false;
}));
$("#minus").addEventListener("click", () => { if (guests > 1) { guests--; renderGuests(); } });
$("#plus").addEventListener("click", () => { if (guests < MAX) { guests++; renderGuests(); } });
function go(n) {
  $("#s1").hidden = n !== 1; $("#s2").hidden = n !== 2; $("#s3").hidden = n !== 3;
  $("#stepN").textContent = Math.min(n, 2); $("#bar").style.setProperty("--p", n === 1 ? .5 : 1);
  $("#steps").hidden = n === 3;
  if (n === 2) { $("#sum").innerHTML = `<b>${DAYS[day]}</b> · ${guests} ${osoba(guests)}`; setTimeout(() => $("#fn").focus({ preventScroll: true }), 250); }
}
$("#next").addEventListener("click", () => day && go(2));
$("#back").addEventListener("click", () => go(1));
$("#s2").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(e.target); if (fd.get("website")) return;
  const fn = (fd.get("fn") || "").trim(), ln = (fd.get("ln") || "").trim(), err = $("#err");
  if (fn.length < 2) { err.textContent = "Upišite ime."; $("#fn").focus(); return; }
  if (ln.length < 2) { err.textContent = "Upišite prezime."; $("#ln").focus(); return; }
  const btn = $("#send"); btn.disabled = true; err.textContent = "";
  try {
    const r = await fetch(`${SB_URL}/rest/v1/pub_reservations`, {
      method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ pub: "downtown", first_name: fn, last_name: ln, guests, day })
    });
    if (!r.ok) throw new Error(r.status);
    $("#ticket").innerHTML = `<div><span>Ime</span><b>${fn.replace(/</g, "&lt;")} ${ln.replace(/</g, "&lt;")}</b></div><div><span>Dan</span><b>${DAYS[day]}</b></div><div><span>Osoba</span><b>${guests}</b></div>`;
    go(3);
  } catch (x) {
    err.textContent = "Rezervacija nije poslana. Pokušajte ponovo ili nas nazovite.";
  } finally { btn.disabled = false; }
});
renderGuests();
})();
</script>
</body>
</html>
