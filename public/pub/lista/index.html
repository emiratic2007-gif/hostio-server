<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DownTown pub · Rezervacije</title>
<meta name="theme-color" content="#0B0A09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0A09;--side:#0F0D0B;--panel:#15120F;--panel2:#1C1814;--line:rgba(255,236,210,.08);--line2:rgba(255,236,210,.14);
  --txt:#F6EFE6;--mut:#9C9187;--dim:#6E655D;--amber:#F4B65A;--amber2:#FFD08A;--copper:#E07A3F;--glow:rgba(244,182,90,.35);--ok:#5EDB8B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,system-ui,sans-serif;color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100svh}
/* sidebar */
aside{background:var(--side);border-right:1px solid var(--line);padding:24px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100svh}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#2A221B,#14110E);box-shadow:inset 0 0 0 1px var(--line2),0 10px 30px -10px var(--glow)}
.logo svg{width:22px;height:22px}
.brand b{display:block;font-weight:500;font-size:1.1rem}.brand b sup{font-size:.55em;color:var(--mut)}
.brand small{color:var(--mut);font-size:.78rem}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:#14110E;box-shadow:inset 0 0 0 1px var(--line)}
.seg span{text-align:center;padding:9px;border-radius:10px;font-size:.88rem;color:var(--mut)}
.seg span.on{background:#241E18;color:var(--txt);box-shadow:inset 0 0 0 1px var(--line2)}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-radius:12px;background:none;color:var(--mut);font:inherit;font-size:.95rem;cursor:pointer;text-align:left}
nav button svg{width:18px;height:18px}
nav button.on{background:#1C1814;color:var(--txt);box-shadow:inset 0 0 0 1px var(--line2)}
nav button em{margin-left:auto;font-style:normal;font-size:.72rem;padding:2px 8px;border-radius:7px;background:rgba(244,182,90,.18);color:var(--amber2)}
.side-note{margin-top:auto;padding:14px;border-radius:16px;background:linear-gradient(160deg,rgba(244,182,90,.14),rgba(224,122,63,.05));box-shadow:inset 0 0 0 1px rgba(244,182,90,.2);font-size:.82rem;color:var(--mut)}
.side-note b{display:block;color:var(--txt);font-weight:500;margin-bottom:2px}
/* main */
main{padding:22px 28px 40px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.who{display:flex;align-items:center;gap:10px;margin-right:auto}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--amber2),var(--copper));color:#1A120A;font-weight:600}
.who small{display:block;font-size:.74rem;color:var(--mut)}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;background:#14110E;box-shadow:inset 0 0 0 1px var(--line2)}
.search input{border:0;background:none;outline:none;color:var(--txt);font:inherit;width:170px}
.search svg{width:16px;height:16px;color:var(--mut)}
.btn{height:44px;padding:0 16px;border:0;border-radius:14px;display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:.9rem;cursor:pointer;color:var(--txt);background:#14110E;box-shadow:inset 0 0 0 1px var(--line2)}
.btn svg{width:16px;height:16px}
.btn.pri{color:#1A120A;background:linear-gradient(180deg,var(--amber2),var(--amber));box-shadow:0 12px 28px -12px var(--glow)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--mut)}
.eyebrow span{padding:4px 10px;border-radius:8px;background:rgba(255,236,210,.06);box-shadow:inset 0 0 0 1px var(--line2);color:var(--txt);font-size:.78rem}
h1{font-weight:400;font-size:2.4rem;letter-spacing:-.035em;margin:8px 0 22px}
.grid{display:grid;grid-template-columns:1fr 1fr 1.05fr;gap:16px}
.card{position:relative;border-radius:24px;padding:20px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.kh{display:flex;align-items:center;gap:12px}
.kh .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(244,182,90,.12);box-shadow:inset 0 0 0 1px rgba(244,182,90,.25)}
.kh .ic svg{width:20px;height:20px;color:var(--amber)}
.kh small{display:block;font-size:.78rem;color:var(--mut)}
.kh b{font-weight:500}
.kh .arr{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line2);color:var(--mut)}
.kh .arr svg{width:15px;height:15px}
.kl{margin-top:22px;font-size:.8rem;color:var(--mut)}
.kv{font-weight:300;font-size:3rem;letter-spacing:-.04em;line-height:1.05}
.kv span{font-size:.45em;color:var(--mut);margin-left:4px;letter-spacing:0}
.chg{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:.84rem;color:var(--ok)}
.chg i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:rgba(94,219,139,.18);font-style:normal;font-size:.7rem}
.spark{position:relative;height:110px;margin:10px -20px -20px}
.spark svg{width:100%;height:100%;display:block}
.spark .tag{position:absolute;padding:4px 9px;border-radius:8px;font-size:.74rem;background:rgba(20,17,14,.85);box-shadow:inset 0 0 0 1px var(--line2);transform:translate(-50%,-140%);white-space:nowrap}
.hero{background:radial-gradient(90% 70% at 100% 0%,rgba(224,122,63,.35),transparent 60%),linear-gradient(170deg,#2A2018,#18130F);box-shadow:inset 0 0 0 1px rgba(244,182,90,.22)}
.hero .new{position:absolute;right:20px;top:20px;padding:5px 12px;border-radius:9px;font-size:.76rem;background:rgba(244,182,90,.2);color:var(--amber2)}
.hero h3{font-weight:400;font-size:1.5rem;letter-spacing:-.02em;margin-top:24px}
.hero p{color:var(--mut);font-size:.9rem;margin-top:6px;line-height:1.45}
.big{font-weight:300;font-size:4.2rem;letter-spacing:-.05em;line-height:1;margin-top:20px;background:linear-gradient(90deg,var(--txt),var(--amber2));-webkit-background-clip:text;background-clip:text;color:transparent}
.split{margin-top:16px;height:10px;border-radius:10px;background:rgba(255,236,210,.06);overflow:hidden;display:flex}
.split i{height:100%}
.legend{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mut);margin-top:8px}
.legend b{color:var(--txt);font-weight:500}
/* list */
.list{margin-top:18px}
.lh{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.lh h2{font-weight:400;font-size:1.15rem;margin-right:auto}
.tabs{display:flex;padding:4px;border-radius:13px;background:#14110E;box-shadow:inset 0 0 0 1px var(--line)}
.tabs button{border:0;background:none;color:var(--mut);font:inherit;font-size:.86rem;padding:8px 14px;border-radius:10px;cursor:pointer}
.tabs button.on{background:#241E18;color:var(--txt);box-shadow:inset 0 0 0 1px var(--line2)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:400;font-size:.78rem;color:var(--dim);padding:0 10px 10px;border-bottom:1px solid var(--line)}
td{padding:14px 10px;border-bottom:1px solid var(--line);font-size:.95rem;vertical-align:middle}
tr:last-child td{border-bottom:0}
.nm{display:flex;align-items:center;gap:12px}
.ini{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:600;color:#1A120A;flex:none}
.nm small{display:block;color:var(--mut);font-size:.76rem}
.dpill{display:inline-flex;padding:5px 10px;border-radius:8px;font-size:.78rem;background:rgba(255,236,210,.06);box-shadow:inset 0 0 0 1px var(--line2)}
.g{font-weight:300;font-size:1.5rem;letter-spacing:-.03em;text-align:right}
.g span{font-size:.55em;color:var(--mut);margin-left:3px}
td.t{color:var(--mut);font-size:.84rem;white-space:nowrap}
.empty{padding:30px 10px;text-align:center;color:var(--mut)}
.msg{padding:80px 0;text-align:center;color:var(--mut)}
.upd{display:inline-flex;align-items:center;gap:6px}
.upd i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
@media (max-width:1100px){.grid{grid-template-columns:1fr 1fr}.hero{grid-column:1/-1}}
@media (max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;align-items:center;padding:14px 16px;border-right:0;border-bottom:1px solid var(--line)}aside .seg,aside nav,.side-note{display:none}main{padding:18px 16px 32px}.search{display:none}h1{font-size:1.9rem}}
@media (max-width:600px){.grid{grid-template-columns:1fr}.hero{order:-1}.kv{font-size:2.6rem}.big{font-size:3.4rem}td.t,th.t{display:none}.topbar .who{display:none}.topbar{justify-content:flex-end}}
@media print{aside,.topbar,.tabs{display:none}.app{display:block}body,.card,.hero{background:#fff!important;color:#000;box-shadow:none}.big,.kv{color:#000;-webkit-text-fill-color:#000}.spark{display:none}td,th{border-color:#ccc}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#F4B65A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h10v13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M16 9h2a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"/><path d="M5 3.5c1.5 1.3 3 1.3 4.5 0s3-1.3 4.5 0 2.5 1 3 .5"/></svg></div><div><b>DownTown<sup>®</sup></b><small>Pub · Dashboard</small></div></div>
        <nav>
      <button type="button" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Pregled</button>
      <button type="button" data-go="2026-10-30"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Petak 30.10.<em id="n30">0</em></button>
      <button type="button" data-go="2026-10-31"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Subota 31.10.<em id="n31">0</em></button>
      <button type="button" onclick="print()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Printaj spisak</button>
    </nav>
    <div class="side-note"><b>Link za goste</b>hostio.ba/downtown</div>
  </aside>

  <main>
    <div class="topbar">
      <div class="who"><div class="av">DT</div><div><small>Vlasnik</small>DownTown pub</div></div>
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Traži ime…" autocomplete="off"></label>
      <button class="btn" id="reload" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Osvježi</button>
      <button class="btn pri" type="button" onclick="print()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><rect x="6" y="14" width="12" height="8"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/></svg>Printaj</button>
    </div>
    <div class="eyebrow"><span class="upd"><i></i><span id="upd" style="padding:0;background:none;box-shadow:none;color:var(--mut)">Učitavam…</span></span></div>
    <h1>Rezervacije za vikend</h1>
    <div id="out"><p class="msg">Učitavam…</p></div>
  </main>
</div>
<script>
(() => {
"use strict";
const SB_URL = "https://eauwnwvieyepzrbildqt.supabase.co";
const SB_KEY = "sb_publishable_iQCs2n49JzTcJyrPadZIiw_xXSI4Qh_";
const DAYS = [["2026-10-30", "Petak", "30.10."], ["2026-10-31", "Subota", "31.10."]];
const COL = ["#FFD08A", "#F4B65A", "#E07A3F", "#F6C9A0", "#C98B52"];
const k = new URLSearchParams(location.hash.slice(1)).get("k") || "";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tm = s => { const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Sarajevo", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date(s)).map(x => [x.type, x.value])); return `${p.day}.${p.month}. u ${p.hour}:${p.minute}`; };
const osoba = n => (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? "osobe" : "osoba";
let rows = [], tab = "all";
const ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
const ARR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';
// cumulative guests over time -> smooth glowing line
function spark(list, id) {
  const W = 300, H = 110;
  let pts;
  if (list.length === 0) pts = [[0, 80], [W, 80]];
  else {
    const t0 = new Date(list[0].created_at).getTime(), t1 = Math.max(t0 + 1, new Date(list[list.length - 1].created_at).getTime());
    let acc = 0; const tot = list.reduce((a, x) => a + x.guests, 0);
    pts = [[0, 92]].concat(list.map(x => { acc += x.guests; return [16 + (new Date(x.created_at).getTime() - t0) / (t1 - t0) * (W - 40), 92 - acc / tot * 66]; }));
    pts.push([W, pts[pts.length - 1][1]]);
  }
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2; d += ` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`; }
  const last = pts[pts.length - 2] || pts[0];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="f${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4B65A" stop-opacity=".28"/><stop offset="1" stop-color="#F4B65A" stop-opacity="0"/></linearGradient><filter id="b${id}"><feGaussianBlur stdDeviation="4"/></filter></defs>
    <line x1="0" x2="${W}" y1="92" y2="92" stroke="rgba(255,236,210,.15)" stroke-dasharray="4 5"/>
    <path d="${d} V${H} H0Z" fill="url(#f${id})"/><path d="${d}" fill="none" stroke="#F4B65A" stroke-width="5" opacity=".5" filter="url(#b${id})"/><path d="${d}" fill="none" stroke="#FFD08A" stroke-width="2.2"/>
    ${list.length ? `<circle cx="${last[0]}" cy="${last[1]}" r="5" fill="#15120F" stroke="#FFD08A" stroke-width="2"/>` : ""}</svg>`;
}
function render() {
  const by = Object.fromEntries(DAYS.map(([d]) => [d, rows.filter(x => x.day === d)]));
  const sum = d => by[d].reduce((a, x) => a + x.guests, 0);
  const total = rows.reduce((a, x) => a + x.guests, 0);
  const avg = rows.length ? (total / rows.length).toFixed(1).replace(".", ",") : "0";
  $("#n30").textContent = by["2026-10-30"].length; $("#n31").textContent = by["2026-10-31"].length;
  const p30 = total ? sum("2026-10-30") / total * 100 : 50;
  const cards = DAYS.map(([d, wd, dt], i) => `
    <div class="card"><div class="kh"><span class="ic">${ICO}</span><div><small>${wd}</small><b>${dt}</b></div><span class="arr">${ARR}</span></div>
      <div class="kl">Gostiju</div><div class="kv">${sum(d)}<span>${osoba(sum(d))}</span></div>
      <div class="chg"><i>↗</i>${by[d].length} rezervacija</div>
      <div class="spark">${spark(by[d], i)}${by[d].length ? `<span class="tag" style="left:${Math.min(80, 8 + 80)}%;top:30%">+${by[d][by[d].length - 1].guests} zadnja</span>` : ""}</div></div>`).join("");
  const hero = `<div class="card hero"><span class="new">Uživo</span><div class="kh"><span class="ic">${ARR}</span><div><small>DownTown<sup>®</sup></small><b>Ukupno za vikend</b></div></div>
    <h3>Gostiju rezervisano</h3><p>${rows.length} rezervacija · prosječno ${avg} ${osoba(Math.round(total / Math.max(1, rows.length)))} po stolu</p>
    <div class="big">${total}</div>
    <div class="split"><i style="width:${p30}%;background:linear-gradient(90deg,#FFD08A,#F4B65A)"></i><i style="width:${100 - p30}%;background:linear-gradient(90deg,#E07A3F,#B85A2A)"></i></div>
    <div class="legend"><span>Petak <b>${sum("2026-10-30")}</b></span><span>Subota <b>${sum("2026-10-31")}</b></span></div></div>`;
  const q = ($("#q").value || "").trim().toLowerCase();
  const list = rows.filter(x => (tab === "all" || x.day === tab) && (!q || `${x.first_name} ${x.last_name}`.toLowerCase().includes(q)));
  const table = `<div class="card list"><div class="lh"><h2>Spisak gostiju</h2><div class="tabs">
      <button type="button" data-t="all" class="${tab === "all" ? "on" : ""}">Svi</button>${DAYS.map(([d, wd]) => `<button type="button" data-t="${d}" class="${tab === d ? "on" : ""}">${wd}</button>`).join("")}</div></div>
    ${list.length ? `<table><thead><tr><th>Ime i prezime</th><th>Dan</th><th class="t">Rezervisano</th><th style="text-align:right">Osoba</th></tr></thead><tbody>${list.map((x, i) => `
      <tr><td><div class="nm"><span class="ini" style="background:${COL[(x.id || i) % COL.length]}">${esc(x.first_name[0] || "")}${esc(x.last_name[0] || "")}</span><div>${esc(x.first_name)} ${esc(x.last_name)}<small>#${x.id}</small></div></div></td>
      <td><span class="dpill">${x.day === "2026-10-30" ? "Petak 30.10." : "Subota 31.10."}</span></td><td class="t">${tm(x.created_at)}</td><td class="g">${x.guests}<span>os.</span></td></tr>`).join("")}</tbody></table>`
      : `<p class="empty">${q ? "Nema gostiju s tim imenom." : "Još nema rezervacija. Podijelite link hostio.ba/downtown na storyju."}</p>`}</div>`;
  $("#out").innerHTML = `<div class="grid">${cards}${hero}</div>${table}`;
  $("#out").querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => { tab = b.dataset.t; render(); }));
}
async function load() {
  if (!k) { $("#out").innerHTML = '<p class="msg">Ovaj link nije potpun. Otvorite link koji ste dobili od Hostia.</p>'; $("#upd").textContent = "Nema pristupa"; return; }
  try {
    const r = await fetch(`${SB_URL}/rest/v1/rpc/pub_list`, { method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_token: k }) });
    if (!r.ok) throw new Error(r.status);
    rows = await r.json();
    $("#upd").textContent = "Ažurirano " + new Date().toLocaleTimeString("bs-BA", { hour: "2-digit", minute: "2-digit" }) + " · osvježava se svake minute";
    render();
  } catch (e) { $("#out").innerHTML = '<p class="msg">Ne mogu učitati rezervacije. Provjerite internet i pokušajte ponovo.</p>'; }
}
$("#q").addEventListener("input", () => rows && render());
$("#reload").addEventListener("click", load);
document.querySelectorAll("nav [data-go]").forEach(b => b.addEventListener("click", () => { tab = b.dataset.go; render(); document.querySelector(".list").scrollIntoView({ behavior: "smooth" }); }));
load(); setInterval(load, 60000);
})();
</script>
</body>
</html>
