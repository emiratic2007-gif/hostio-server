<!doctype html><html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0b0b0d"><meta name="description" content="Demo sajt izmišljene radionice Zamajac, napravio hostio.ba."></head><body><title>Zamajac Auto Servis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: sajt radionice, crna scena + crveni akcenat; jedini šareni trenutak je opis problema. */
:root{
  --ink:#0b0b0d;--ink2:#17171b;--ink3:#2a2a31;--paper:#fff;--mist:#f4f4f5;--line:#e5e5e8;
  --body:#55555c;--soft:#a5a5ad;--red:#e0121c;--red-d:#b70c15;--red-t:#fdecec;
  --amber:#a86200;--amber-t:#fff3dc;--green:#0f7a42;--green-t:#e4f6eb;
  --c1:#ff2d87;--c2:#ff7a00;--c3:#ffd400;--c4:#00cfff;--c5:#7a3cff;--c6:#19e08f;
  --font:'Poppins',ui-sans-serif,system-ui,'Segoe UI',Roboto,Arial,sans-serif;color-scheme:light;
  --gut-l:max(18px,env(safe-area-inset-left,0px));--gut-r:max(18px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--font);overflow-x:hidden}
body.lock{overflow:hidden}
#site{overflow-x:clip}
h1,h2,h3,p{margin:0}h1,h2,h3{text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--red);color:#fff;font-weight:600;font-size:15px;min-height:52px;padding:0 24px;border-radius:7px;transition:background .15s,transform .12s}
.btn:hover{background:var(--red-d)}.btn:active{transform:scale(.97)}
.btn.full{width:100%}.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}.btn.ghost:hover{border-color:var(--ink)}
.btn.wh{background:#fff;color:var(--ink)}.btn.wh:hover{background:var(--mist)}
.chev{width:7px;height:12px;flex:none}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.14em;font-size:15px;line-height:1.2;color:#fff}
.logo svg{width:30px;height:30px;flex:none;transform-origin:center}.logo small{display:block;font-weight:400;font-size:9px;letter-spacing:.2em;color:var(--soft)}

/* zaglavlje */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:11px}
.top .btn{min-height:40px;padding:0 15px;font-size:13px}.tb{display:none}.hrs{font-size:12px;color:var(--soft)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--ink)}

/* hero */
.hero{background:var(--ink);color:#fff;overflow:hidden;position:relative}
.hero-copy{padding-block:36px 4px;position:relative;z-index:2}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.eyebrow b{color:#fff;font-weight:500}
.hero h1{font-weight:300;font-size:clamp(36px,10.6vw,58px);line-height:1.08;letter-spacing:-.025em;margin-top:12px}
.hero h1 b{font-weight:800;color:#ff2730}
.ln{display:block;overflow:hidden;padding-bottom:.07em}
.ln>span{display:block;animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.ln:nth-child(2)>span{animation-delay:.12s}.ln:nth-child(3)>span{animation-delay:.24s}
@keyframes rise{from{transform:translateY(112%)}}
.hero p{color:#c9c9cf;margin-top:14px;font-size:15.5px;max-width:37ch;animation:up .8s .45s both}
.hero .cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;animation:up .8s .55s both}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.scene{position:relative;display:block;width:100%;height:auto;margin-top:6px;will-change:transform}
.drive{animation:drive 1.25s cubic-bezier(.2,.8,.2,1) .25s both}
@keyframes drive{from{transform:translateX(-440px)}}
.rise{animation:lift 1.1s cubic-bezier(.6,0,.2,1) 1.55s both}
@keyframes lift{from{transform:translateY(31px)}}
.arms{animation:fadein .4s 1.35s both}@keyframes fadein{from{opacity:0}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .35s linear .25s 3 both}
@keyframes spin{to{transform:rotate(360deg)}}
.beam{animation:flick 1.1s .1s both}
.beam.b2{animation-delay:.3s}
@keyframes flick{0%{opacity:0}18%{opacity:1}24%{opacity:.15}38%{opacity:1}46%{opacity:.4}60%,100%{opacity:1}}
.scan{animation:scan 3.4s ease-in-out 2.7s infinite both}
@keyframes scan{0%{transform:translateX(0);opacity:0}8%{opacity:1}50%{transform:translateX(286px);opacity:1}58%,100%{transform:translateX(286px);opacity:0}}
.tag{animation:tag .5s both}
.tag.t1{animation-delay:3s}.tag.t2{animation-delay:3.5s}.tag.t3{animation-delay:4s}
@keyframes tag{from{opacity:0;transform:translateY(5px)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.5);opacity:0}}

/* traka */
.band{background:var(--red);color:#fff;overflow:hidden;position:relative;z-index:3}
.band div{display:flex;width:max-content;animation:mq 26s linear infinite;font-weight:600;font-size:12px;letter-spacing:.1em;padding-block:9px;white-space:nowrap}
.band span{padding-right:26px}.band span::after{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:#fff;margin-left:26px;vertical-align:2px}
@keyframes mq{to{transform:translateX(-50%)}}

/* sekcije */
section{padding-block:72px;scroll-margin-top:62px}
.h2{font-weight:300;font-size:clamp(29px,7.8vw,46px);line-height:1.12;letter-spacing:-.02em}
.h2 b{font-weight:700;display:block}.h2 .r{color:var(--red)}
.lead{color:var(--body);margin-top:12px;max-width:44ch}
.rv{transition:opacity .7s ease,transform .7s cubic-bezier(.16,1,.3,1)}
.pre{opacity:.15;transform:translateY(30px)}

/* usluge */
.svc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:28px}
.sv{background:var(--mist);color:var(--ink);padding:16px;text-align:left;display:flex;flex-direction:column;gap:3px;border-radius:12px;transition:background .2s,color .2s,transform .2s}
.sv svg{width:26px;height:26px;color:var(--red);margin-bottom:12px;transition:color .2s,transform .4s cubic-bezier(.16,1,.3,1)}
.sv:hover{background:var(--ink);color:#fff;transform:translateY(-3px)}.sv:hover svg{color:#fff;transform:scale(1.12)}.sv:hover small{color:#b9b9c0}
.sv b{font-weight:600;font-size:14.5px;line-height:1.3}
.sv small{font-size:12px;color:var(--body);line-height:1.4}

/* rendgen */
.xcard{background:var(--ink);color:#fff;border-radius:14px;padding:18px 16px 16px;margin-top:26px}
.xtop{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.xr{display:block;width:100%;height:auto;margin-top:10px;overflow:visible}
.xr *{fill:none;stroke-linecap:round;stroke-linejoin:round}
.xb *{stroke:#9a9aa3;stroke-width:1.1}
.xp *{stroke:#62626c;stroke-width:1;transition:stroke .3s,stroke-width .3s}
.xp.on *{stroke:#ff3a43;stroke-width:1.7}
.xp.on{filter:drop-shadow(0 0 5px rgba(255,39,48,.7))}
.draw .xb *,.draw .xp *{stroke-dasharray:1;animation:xdraw 1.8s ease-out both}.draw .xp *{animation-delay:.5s}
@keyframes xdraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.xch{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:14px}.xch::-webkit-scrollbar{display:none}
.xc{flex:none;font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:30px;background:var(--ink2);color:#c9c9cf;transition:background .2s,color .2s}
.xc.on{background:var(--red);color:#fff}
.xcap{min-height:92px;margin-top:12px}.xcap p{font-size:14px;color:#d6d6db;line-height:1.5}
.xbk{display:inline-flex;align-items:center;gap:8px;color:#fff;font-weight:600;font-size:13.5px;min-height:40px;margin-top:2px}
/* tahometar */
.why{background:var(--ink);color:#fff}
.tacho{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:2;background:var(--ink);padding-block:14px 8px;margin-top:18px}
.tacho svg{display:block;width:min(100%,225px);margin:0 auto}
.needle{transform-origin:150px 150px;transition:transform .18s linear}
.rs{display:grid;margin-top:6px}
.rs article{padding-block:24px;border-top:1px solid var(--ink3);transition:opacity .3s}
.rs h3{font-size:19px;font-weight:600;line-height:1.2}
.rs p{color:#b9b9c0;margin-top:5px;font-size:14.5px}
.rs article.dim{opacity:.55}

/* AI */
.aiw{position:relative;overflow:hidden;color:#fff;isolation:isolate;background:#6a2cff}
.aiw::before,.aiw::after{content:"";position:absolute;z-index:-1;inset:-40%;background:
 radial-gradient(38% 34% at 22% 26%,var(--c1),transparent 70%),
 radial-gradient(34% 34% at 78% 22%,var(--c2),transparent 70%),
 radial-gradient(36% 36% at 74% 76%,var(--c4),transparent 70%),
 radial-gradient(40% 36% at 26% 80%,var(--c5),transparent 70%);animation:blob 13s ease-in-out infinite alternate}
.aiw::after{background:radial-gradient(24% 22% at 52% 50%,var(--c3),transparent 72%),radial-gradient(22% 24% at 12% 56%,var(--c6),transparent 72%);mix-blend-mode:screen;opacity:.55;animation-duration:9s;animation-direction:alternate-reverse}
@keyframes blob{0%{transform:rotate(0) scale(1)}50%{transform:rotate(26deg) scale(1.14) translateX(4%)}100%{transform:rotate(-20deg) scale(1.05) translateY(-5%)}}
.aiw h2,.aiw h3.big{font-weight:700;font-size:clamp(32px,9vw,52px);line-height:1.08;letter-spacing:-.025em}
.aiw .sub{font-weight:500;margin-top:12px;font-size:16px;max-width:36ch;text-shadow:0 1px 12px rgba(60,0,90,.45)}
.stk{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.st{font-weight:600;font-size:14px;color:var(--ink);padding:8px 15px;border-radius:40px;transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.st:nth-child(6n+1){background:var(--c3);transform:none}.st:nth-child(6n+2){background:#fff;transform:none}.st:nth-child(6n+3){background:var(--c6);transform:none}.st:nth-child(6n+4){background:#8fe9ff;transform:none}.st:nth-child(6n+5){background:#ffb0d4;transform:none}.st:nth-child(6n){background:#ffbe7a;transform:none}
.st:hover{transform:translateY(-2px)}.st:active{transform:scale(.94)}
.tbox{margin-top:18px;background:#fff;color:var(--ink);padding:6px;border-radius:14px;box-shadow:0 16px 40px rgba(50,0,90,.28)}
.tbox textarea{display:block;width:100%;min-height:86px;border:0;background:transparent;padding:13px 13px 4px;resize:vertical;font-size:16px;line-height:1.45;outline:none}
.tbox textarea::placeholder{color:#8d8d97;font-weight:400}
.go{width:100%;min-height:54px;border-radius:10px;color:#fff;font-weight:700;font-size:15.5px;background:var(--ink);display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .12s}
.go:active{transform:scale(.98)}@keyframes slide{to{background-position:-300% 0}}
.go svg{width:16px;height:16px}
.wv{display:flex;align-items:center;gap:2px;height:40px;padding:10px 13px 0}
.wv i{flex:1;height:100%;border-radius:2px;transform:scaleY(calc(var(--h)*.45));animation:wv 1.1s ease-in-out infinite alternate;transition:transform .2s}
@keyframes wv{to{transform:scaleY(calc(var(--h)*.85))}}
.wv.loud i{animation:wvl .32s ease-in-out infinite alternate}
@keyframes wvl{from{transform:scaleY(calc(var(--h)*.5))}to{transform:scaleY(min(1,calc(var(--h)*1.3)))}}
.pw{text-align:center;font-size:10.5px;color:#9a9aa3;letter-spacing:.02em;padding:8px 0 3px}
.pw a{color:#55555c;font-weight:600;text-decoration:none}.pw b{color:#12a85e;font-weight:600}
.aout{display:grid;gap:10px;margin-top:18px}
.aout:empty{display:none}
.swarm{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;max-width:240px}
.swarm i{aspect-ratio:1;animation:wave 1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:scale(.4);opacity:.45}50%{transform:scale(1);opacity:1}}
.thk{display:grid;gap:10px;font-weight:600}
.rhead{font-weight:700;font-size:17px;text-shadow:0 1px 10px rgba(60,0,90,.45)}
.fc{display:block;width:100%;background:#fff;color:var(--ink);border-radius:12px;padding:14px;text-align:left;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both;border:2px solid transparent}
.fc:nth-child(3){animation-delay:.08s}.fc:nth-child(4){animation-delay:.16s}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.fc.on{border-color:var(--ink)}
.fr{display:flex;gap:12px}
.fi{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:10px;color:var(--ink)}
.fi svg{width:23px;height:23px}
.fn{font-weight:700;font-size:15px;line-height:1.3}
.fw{font-size:13px;color:var(--body);margin-top:3px;line-height:1.45}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:30px;margin-top:8px}
.pill::before{content:"";width:6px;height:6px;background:currentColor}
.u1{background:var(--green-t);color:var(--green)}.u2{background:var(--amber-t);color:var(--amber)}.u3{background:var(--red-t);color:var(--red-d)}
.ftick{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;align-self:center}
.on .ftick{background:var(--ink);border-color:var(--ink)}
.ftick svg{width:14px;height:14px;opacity:0}.on .ftick svg{opacity:1}
.ainote{font-size:12.5px;font-weight:500;text-shadow:0 1px 8px rgba(60,0,90,.6)}
.aiq{background:rgba(11,11,13,.82);padding:12px 14px;border-radius:10px;font-size:14px;font-weight:500}

/* postupak */
.flow{position:relative;margin-top:30px;display:grid;gap:30px;padding-left:44px}
.flow::before{content:"";position:absolute;left:15px;top:6px;bottom:6px;width:2px;background:var(--line)}
.prog{position:absolute;left:15px;top:6px;bottom:6px;width:2px;background:var(--red);transform-origin:top;transform:scaleY(.04)}
.pcar{position:absolute;left:4px;top:-4px;width:24px;height:40px;z-index:2;will-change:transform}.pcar svg{display:block}
.fs{position:relative}
.fs i{position:absolute;left:-44px;top:0;width:32px;height:32px;display:grid;place-items:center;background:var(--ink);color:#fff;font:700 13px var(--font)}
.fs h3{font-size:18px;font-weight:600;line-height:1.3;padding-top:2px}.fs p{color:var(--body);margin-top:4px;font-size:14.5px}

/* lokacija */
.loc{background:var(--mist)}
.locg{display:grid;gap:22px;margin-top:24px}
.map{display:block;width:100%;height:auto;background:#fff;border-radius:7px}
.pinp{transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
.info{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14.5px}
.info dt{color:var(--body)}.info dd{margin:0;font-weight:500}
.info{margin:0}

/* završni */
.final{background:var(--red);color:#fff;overflow:hidden;position:relative}
.final .h2 b{color:#fff}.final .btn{margin-top:22px;position:relative}
.final .tire{position:absolute;right:-90px;bottom:-90px;width:290px;height:290px;color:#fff;opacity:.13;animation:slowspin 18s linear infinite}
@keyframes slowspin{to{transform:rotate(360deg)}}
.foot{background:var(--ink);color:var(--soft);font-size:12.5px;padding-block:28px calc(92px + env(safe-area-inset-bottom,0px))}
.foot .row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-top:16px}
.foot button{color:var(--soft);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;min-height:36px}
.foot button:hover{color:#fff}

/* plutajuće dugme */
.fab{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px var(--gut-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gut-l);transform:translateY(120%);transition:transform .35s cubic-bezier(.16,1,.3,1);pointer-events:none}
.fab.show{transform:none;pointer-events:auto}.fab .btn{width:100%;max-width:520px;display:flex;margin:0 auto;box-shadow:0 12px 30px rgba(11,11,13,.35)}

/* rezervacija */
.bk{position:fixed;inset:0;z-index:40;background:#fff;display:flex;flex-direction:column;animation:bkin .45s cubic-bezier(.16,1,.3,1) both;padding-top:env(safe-area-inset-top,0px)}
@keyframes bkin{from{transform:translateY(100%)}}
.bk-h{flex:none;padding:12px var(--gut-r) 10px var(--gut-l);border-bottom:1px solid var(--line)}
.bk-t{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:560px;margin:0 auto}
.bk-t b{font-weight:600;font-size:14px}
.ic{width:40px;height:40px;display:grid;place-items:center;font-size:24px;line-height:1;color:var(--ink)}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:560px;margin:7px auto 0}
.bars i{height:4px;background:var(--line);transition:background .3s}.bars i.on{background:var(--red)}
.bk-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.bk-in{max-width:560px;margin:0 auto;padding:22px var(--gut-r) 26px var(--gut-l);animation:stepin .4s cubic-bezier(.16,1,.3,1) both}
@keyframes stepin{from{opacity:0;transform:translateX(26px)}}
.bk-f{flex:none;padding:10px var(--gut-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gut-l);border-top:1px solid var(--line);background:#fff}
.bk-f .btn{display:flex;width:100%;max-width:520px;margin:0 auto}
.bh{font-size:26px;font-weight:300;line-height:1.16;letter-spacing:-.015em}.bh b{font-weight:700;color:var(--red)}
.lab{font-weight:600;font-size:13.5px;margin-top:24px}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:9px;padding-block:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:60px;height:74px;border:1.5px solid var(--line);border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .15s}
.day small{font-size:11.5px;color:var(--body)}.day b{font-size:21px;font-weight:600;line-height:1.2}
.day.on{background:var(--red);border-color:var(--red);color:#fff}.day.on small{color:#fff}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}
.slot{height:48px;border:1.5px solid var(--line);border-radius:7px;font-weight:500;font-variant-numeric:tabular-nums}
.slot.on{background:var(--ink);border-color:var(--ink);color:#fff}
.slot[disabled]{color:#bdbdc4;background:var(--mist);border-color:var(--mist);text-decoration:line-through;cursor:not-allowed}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.opt{min-height:50px;border:1.5px solid var(--line);border-radius:7px;font-size:13.5px;font-weight:500;padding:6px}
.opt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.aibtn{display:block;width:100%;text-align:left;margin-top:18px;border-radius:14px;overflow:hidden;padding:18px;color:#fff}
.aibtn b{display:block;font-weight:700;font-size:21px;line-height:1.12;letter-spacing:-.015em}
.aibtn small{display:block;font-size:13.500px;font-weight:500;margin-top:5px}
.aipanel{margin-top:18px;border-radius:14px;padding:20px 16px;margin-inline:calc(-1*var(--gut-l)/2)}
.search{position:relative;margin-top:9px}.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--soft)}
.search input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:7px;padding:0 14px 0 42px;font-size:16px;outline:none;background:#fff}
.search input:focus,.field input:focus,.field textarea:focus{border-color:var(--ink)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.cat{display:flex;align-items:center;gap:9px;text-align:left;font-size:13px;font-weight:500;line-height:1.2;padding:10px;min-height:50px;background:var(--mist);border:1.5px solid var(--mist);border-radius:7px}
.cat svg{width:20px;height:20px;flex:none}.cat.on{background:var(--ink);border-color:var(--ink);color:#fff}

.g{display:block;width:100%;height:auto;font-family:var(--font)}
.g .sp{animation:rot 5s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.ekg{stroke-dasharray:1;animation:xdraw 2.4s linear infinite}
.blink{animation:bl 1.4s steps(2) infinite}@keyframes bl{50%{opacity:.25}}
.oil{animation:oil 4s ease-in-out infinite alternate}@keyframes oil{from{transform:translateY(62px)}to{transform:translateY(0)}}
.roll{animation:roll 8s steps(4) infinite}@keyframes roll{to{transform:translateY(-144px)}}
.pad{animation:pad 1.6s ease-in-out infinite alternate}@keyframes pad{from{transform:translateX(0)}to{transform:translateX(-9px)}}

.wb{animation:wb 3s ease-in-out infinite}@keyframes wb{0%,18%,48%,100%{transform:none}32%{transform:translateY(-14px)}}
.spr{transform-origin:160px 26px;animation:sq 3s ease-in-out infinite}@keyframes sq{0%,18%,48%,100%{transform:none}32%{transform:scaleY(.72)}}
.knob{animation:knob 6s cubic-bezier(.7,0,.3,1) infinite}@keyframes knob{0%,12%{transform:none}24%,34%{transform:translate(0,100px)}46%,56%{transform:translate(60px,0)}68%,78%{transform:translate(60px,100px)}90%,100%{transform:translate(120px,0)}}
.tp{transform-box:fill-box;transform-origin:bottom;animation:tp 5s ease-in-out infinite alternate}@keyframes tp{to{transform:scaleY(.35)}}
.t1{animation:t1 5s ease-in-out infinite alternate}@keyframes t1{0%,40%{opacity:1}60%,100%{opacity:0}}
.t2{animation:t2 5s ease-in-out infinite alternate}@keyframes t2{0%,40%{opacity:0}60%,100%{opacity:1}}
.ch{transform-box:fill-box;transform-origin:left;animation:chg 3.4s ease-out infinite}@keyframes chg{from{transform:scaleX(.08);fill:#e0121c}to{transform:none}}
.bt{transform-box:fill-box;transform-origin:center;animation:btp 1.2s ease-in-out infinite alternate}@keyframes btp{to{transform:scale(1.14)}}
.pin{animation:pin 2.2s ease-in-out infinite alternate}@keyframes pin{to{transform:translateY(-26px)}}
.does{display:grid;gap:18px;margin-top:24px}
.dd{display:flex;gap:12px}.tk{flex:none;width:8px;height:8px;background:var(--red);margin-top:8px}
.dd b{display:block;font-weight:600;font-size:15.5px;line-height:1.35}.dd small{display:block;color:var(--body);font-size:13.5px;line-height:1.5;margin-top:2px}
.signs{list-style:none;margin:20px 0 0;padding:0;display:grid}
.signs li{padding-block:12px;border-top:1px solid var(--ink3);font-size:15.5px}
.fx{display:grid;gap:10px}.fxi{background:var(--ink2);border-radius:12px;padding:15px}
.fxi b{display:block;font-size:21px;font-weight:700;color:#ff3a43;line-height:1.2}.fxi span{display:block;font-size:13.5px;color:#c9c9cf;margin-top:3px;line-height:1.45}
.st4{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:16px}
.st4 li{display:flex;gap:13px;align-items:flex-start;font-size:15px}

.fq .fl{background:#fff;border-color:transparent;align-items:center}.fq{margin-top:18px}
.nxt{display:grid;grid-template-columns:1fr auto;width:100%;text-align:left;background:var(--ink);color:#fff;padding:20px;border-radius:14px;align-items:center;gap:0 12px}
.nxt small{color:var(--soft);font-size:12px;grid-column:1}.nxt b{font-size:20px;font-weight:600;grid-column:1;line-height:1.25}.nxt svg{grid-column:2;grid-row:1/3}
.xmore{color:#c9c9cf;font-size:13px;margin-left:14px;text-decoration:underline;text-underline-offset:3px;min-height:40px}
.pfab{display:block}

const STOP=new Set('auto auta autu kad kada kod sam ali ili ima imam nije nesto mi se je da na u i a od po za sa s ne to taj ovo vrlo jako malo samo kao pa te tako bas stalno'.split(' '));
const same=(a,b)=>{if(a.length<3||b.length<3)return false;let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;return i>=Math.max(3,Math.min(a.length,b.length)-2);};
const INDEX=DB.map(f=>({f,kw:norm(f.kw).split(/\s+/),nm:norm(f.name).split(/\s+/),ds:norm(f.desc).split(/\s+/)}));
function scoreAll(q){const ws=norm(q).split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));if(!ws.length)return[];
  return INDEX.map(x=>{let s=0,h=0;for(const w of ws){let m=0;if(x.kw.some(k=>same(k,w)))m+=3;if(x.nm.some(k=>same(k,w)))m+=2;else if(x.ds.some(k=>same(k,w)))m+=1;if(m)h++;s+=m;}return{f:x.f,s,h};}).filter(x=>x.s>=2).sort((a,b)=>b.s-a.s);}
const localMatch=(q,n)=>{const few=norm(q).split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)).length<2;let l=scoreAll(q).filter(x=>x.s>=3);if(few)l=l.filter(x=>x.f.u<3).concat(l.filter(x=>x.f.u===3));return l.slice(0,n).map(x=>x.f);};

function closeBook(){S.book=null;$('book').innerHTML='';document.body.classList.remove('lock');refreshSiteAi();}

function fList(){const q=S.q.trim();let l=[];
 if(q){l=scoreAll(q).map(x=>x.f);if(!l.length){const n=norm(q);l=DB.filter(f=>norm(f.name).includes(n));}}
 else if(S.cat)l=DB.filter(f=>f.cat===S.cat);
 return l.slice(0,q?12:40);}

 return `<h2 class="bh">Šta ne valja<br><b>s autom?</b></h2>
 ${S.aiOpen?`<div class="aiw aipanel"><h3 class="big" style="font-size:25px">Recite kako zvuči.</h3>${aiControls('book')}${aiBox('book')}<div class="aout" data-aout aria-live="polite">${aiOut()}</div></div>`:`<button class="aiw aibtn" data-aiopen="1"><b>Ne znate šta je?<br>Opišite nam.</b><small>Pronaći ćemo moguće kvarove.</small></button>`}

 return `${q?'':`<div class="cats">${Object.entries(CATS).map(([k,v])=>`<button class="cat ${S.cat===k?'on':''}" data-cat="${k}">${IC(k)}${v}</button>`).join('')}</div>`}

function renderBook(fresh){const box=$('book');const oldTop=box.querySelector('.bk-b')?.scrollTop||0;
 if(S.done){const d=S.done;let cf='';for(let i=0;i<26;i++){const a=i/26*6.283;const r=70+((i*37)%90);cf+=`<i class="conf" style="background:${COLORS[i%6]};--x:${Math.round(Math.cos(a)*r)}px;--y:${Math.round(Math.sin(a)*r)}px;animation-delay:${(i%5)*.03+.2}s"></i>`;}
  box.innerHTML=`<div class="bk" style="animation:none"><div class="bk-h"><div class="bk-t"><b>Rezervacija</b><button class="ic" data-close="1" aria-label="Zatvori">×</button></div></div><div class="bk-b"><div class="bk-in okk">${cf}<svg class="ck" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="40"/><path d="m27 43 11 11 20-23" fill="none" stroke="#fff" stroke-width="6"/></svg><h2 class="bh">Primili smo<br><b>vaš zahtjev.</b></h2><p class="fw" style="font-size:14.5px;margin-top:10px">Potvrdu šaljemo na ${esc(d.phone)}.</p><div class="sum"><div><b>Termin:</b> ${esc(d.when)}</div><div><b>Auto:</b> ${esc(d.car)}</div><div><b>Problem:</b> ${esc(d.issue)}</div></div></div></div><div class="bk-f"><button class="btn" data-close="1">Nazad na sajt</button></div></div>`;return;}
 const st=S.step;let body='';
 if(st===1)body=`<h2 class="bh">Kad vam<br><b>odgovara?</b></h2><div class="lab">Dan</div><div class="days">${DAYS.map((d,i)=>`<button class="day ${S.day===i?'on':''}" data-day="${i}" aria-label="${d.k} ${d.n}.${d.m}."><small>${d.k}</small><b>${d.n}</b></button>`).join('')}</div><div class="lab">Sat</div><div class="slots">${SLOTS.map((t,i)=>`<button class="slot ${S.slot===t?'on':''}" data-slot="${t}" ${taken(S.day,i)?'disabled aria-label="'+t+' zauzeto"':''}>${t}</button>`).join('')}</div><div class="lab">Dok traje servis</div><div class="opts">${['Čekam u servisu','Ostavljam auto'].map(o=>`<button class="opt ${S.how===o?'on':''}" data-how="${o}">${o}</button>`).join('')}</div>${S.err?`<p class="err" role="alert">${esc(S.err)}</p>`:''}`;
 if(st===2)body=step2();
 if(st===3){const dd=DAYS[S.day];body=`<h2 class="bh">Još samo<br><b>vaši podaci.</b></h2><div class="sum"><div><b>Termin:</b> ${dd.k} ${dd.n}.${dd.m}. u ${S.slot}</div><div><b>Problem:</b> ${esc(issueText())}</div></div><label class="field"><span>Ime</span><input id="fName" autocomplete="given-name" value="${esc(S.name)}" placeholder="npr. Amra"></label><label class="field"><span>Broj telefona</span><input id="fPhone" inputmode="tel" autocomplete="tel" value="${esc(S.phone)}" placeholder="06x xxx xxx"></label><label class="field"><span>Auto</span><input id="fCar" value="${esc(S.car)}" placeholder="npr. Golf 7, 2016"></label><label class="field"><span>Napomena (po želji)</span><textarea id="fNote">${esc(S.note)}</textarea></label>${S.err?`<p class="err" role="alert">${esc(S.err)}</p>`:''}<p class="fw" style="margin-top:10px">Bez registracije i bez lozinke. Ovo je demo sajt: upišite izmišljene podatke.</p>`;}
 box.innerHTML=`<div class="bk" style="${fresh?'':'animation:none'}"><div class="bk-h"><div class="bk-t"><button class="ic" data-back="1" aria-label="Nazad">${st>1?'‹':''}</button><b>Korak ${st} od 3</b><button class="ic" data-close="1" aria-label="Zatvori">×</button></div><div class="bars">${[1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div></div><div class="bk-b" id="bkb"><div class="bk-in" style="${fresh===false?'animation:none':''}">${body}</div></div><div class="bk-f"><button class="btn" data-next="1">${st<3?'Dalje':'Rezerviši termin'} ${CHEV}</button></div></div>`;
 if(fresh===false)box.querySelector('.bk-b').scrollTop=oldTop;}
function issueText(){return S.picked.length?S.picked.map(id=>byId(id).name).join(', '):(S.ai.text.trim()||'Neka majstor pogleda');}

function nextStep(){saveForm();S.err='';
 if(S.step===1){if(!S.slot){S.err='Izaberite sat.';renderBook(false);return;}S.step=2;renderBook();return;}
 if(S.step===2){S.step=3;renderBook();return;}
 const n=S.phone.replace(/\D/g,'').length;S.err=!S.name.trim()?'Upišite ime.':n<8?'Upišite ispravan broj telefona.':!S.car.trim()?'Upišite koji je auto.':'';
 if(S.err){renderBook(false);return;}
 const dd=DAYS[S.day];const r={id:Date.now(),name:S.name.trim(),phone:S.phone.trim(),car:S.car.trim(),issue:issueText(),when:`${dd.k} ${dd.n}.${dd.m}., ${S.slot}`,how:S.how,note:S.note.trim()};
 rpc('shop_request',{p_shop:SHOP,p_data:{name:r.name,phone:r.phone,car:r.car,issue:r.issue,when:r.when,how:r.how,note:r.note}}).catch(()=>toast('Zahtjev nije poslan. Provjerite internet i pokušajte ponovo.'));S.done=r;S.picked=[];S.slot=null;S.name=S.phone=S.car=S.note='';S.ai={text:'',state:'idle',res:null,q:'',local:false};renderBook();}
async function runAi(ctx){const ta=$('ai-'+ctx);const t=ta.value.trim();S.ai.text=t;
 if(t.length<3){S.ai.state='none';putAi();return;}
 S.ai.state='busy';putAi();const my=(runAi.n=(runAi.n||0)+1);const min=new Promise(r=>setTimeout(r,900));
 let r=null;try{r=await aiMatch(t)}catch(e){}await min;if(my!==runAi.n)return;
 if(r){S.ai.res=r.list;S.ai.q=r.q;S.ai.state='done';}else{const l=localMatch(t,3);if(l.length){S.ai.res=l.map(f=>({f}));S.ai.q='';S.ai.state='done';}else S.ai.state='none';}
 putAi();}

 if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}throw new Error(m||('HTTP '+r.status))}const t=await r.text();return t?JSON.parse(t):null;}

 if(a==='no'){const r=S.reqs.find(x=>x.id===id);S.reqs=S.reqs.filter(x=>x.id!==id);del('req',id);rLog('odbio zahtjev',`${r.car} · ${r.issue}`);renderRadnja(true);toast('Zahtjev je odbijen');return}
