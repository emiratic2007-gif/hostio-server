<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hostio · Instagram</title>
<style>
:root{--bg:#111316;--panel:#1c1f24;--text:#f2f4f6;--muted:#9aa2ac;--accent:#2ee6a6;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 50% 30%,#1b2a24,var(--bg) 60%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.box{width:min(420px,100%);background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:32px 24px;text-align:center}
.ic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;font-size:34px;font-weight:800}
.ok .ic{background:var(--accent);color:#06261b;box-shadow:0 0 40px rgba(46,230,166,.45)}
.no .ic{background:rgba(255,107,107,.15);color:var(--bad)}
h1{font-size:22px;margin-bottom:8px}
p{color:var(--muted);line-height:1.5}
small{display:block;margin-top:22px;color:var(--muted)}
small b{color:var(--accent)}
</style>
</head>
<body>
<div class="box" id="box"></div>
<script>
  const p = new URLSearchParams(location.search);
  const box = document.getElementById("box");
  const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  if (p.get("ok") === "1") {
    box.className = "box ok";
    box.innerHTML = `<div class="ic">✓</div><h1>Instagram je povezan</h1><p>Profil <b>@${esc(p.get("ime"))}</b> je sada povezan s Hostiom. Poruke koje stignu na Instagram Hostio će od sada odgovarati automatski.</p><small>pokreće <b>hostio</b></small>`;
  } else {
    box.className = "box no";
    box.innerHTML = `<div class="ic">!</div><h1>Povezivanje nije uspjelo</h1><p>${esc(p.get("razlog") || "Pokušajte ponovo.")}</p><small>pokreće <b>hostio</b></small>`;
  }
</script>
</body>
</html>
