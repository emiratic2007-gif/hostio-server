<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rent a Car</title>
<meta name="theme-color" content="#111316">
<meta name="description" content="Rent a car: vozila, cijene, dostupnost i online rezervacija.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#2ee6a6; --accent-ink:#06261b; --accent-soft:rgba(46,230,166,.14);
  --bg:#111316; --bg2:#16191d; --panel:#1c1f24; --panel2:#23272d; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#f2f4f6; --muted:#9aa2ac; --card:#f3f4f6; --card2:#e7e9ed; --ink:#14171b; --ink-muted:#6b737d;
  --danger:#ff6b6b; --r:28px; --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html[lang=ar]{--font:"Tajawal","Plus Jakarta Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{display:block}
.wrap{width:min(1200px,100%);margin:0 auto;padding:0 16px}
@media(min-width:720px){.wrap{padding:0 28px}}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* demo + header */
.demo{background:var(--accent-soft);color:var(--accent);font-size:13px;text-align:center;padding:8px 16px;font-weight:600}
header.top{position:sticky;top:0;z-index:40;background:rgba(17,19,22,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;min-width:0}
.logo b{width:38px;height:38px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:19px;flex:none;box-shadow:0 0 24px rgba(46,230,166,.35)}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.links{display:none;gap:4px;margin-inline-start:auto}
nav.links a{padding:9px 14px;border-radius:99px;color:var(--muted);font-weight:600;font-size:14px;transition:.2s}
nav.links a:hover{color:var(--text);background:var(--panel)}
@media(min-width:900px){nav.links{display:flex}}
.top .tools{display:flex;gap:8px;margin-inline-start:auto}
@media(min-width:900px){.top .tools{margin-inline-start:8px}}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);transition:.2s;flex:none}
.round:hover{border-color:var(--line2);background:var(--panel2)}
.round.mint{background:var(--accent);color:var(--accent-ink);border:0}
.pill-btn{height:44px;padding:0 14px;border-radius:99px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px}
.pill-btn:hover{border-color:var(--line2)}

/* hero */
.hero{position:relative;padding:34px 0 20px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-30% -10% auto auto;width:720px;height:720px;background:radial-gradient(closest-side,rgba(46,230,166,.16),transparent);pointer-events:none}
.hero-grid{display:grid;gap:18px;align-items:center;position:relative}
@media(min-width:960px){.hero-grid{grid-template-columns:1.05fr 1fr;gap:28px}.hero{padding:56px 0 28px}}
.kicker{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.hero h1{font-size:clamp(38px,7.4vw,68px);line-height:1.02;letter-spacing:-.035em;font-weight:800;margin:16px 0 14px}
html[lang=ar] .hero h1{letter-spacing:0;line-height:1.2}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.sub{color:var(--muted);font-size:17px;max-width:500px}
.stage{position:relative;aspect-ratio:16/10;display:grid;place-items:center}
.stage .disc{position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(46,230,166,.30),rgba(46,230,166,.06) 60%,transparent 70%)}
.stage .ring{position:absolute;width:64%;aspect-ratio:1;border-radius:50%;border:1px dashed rgba(46,230,166,.28);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stage svg.car,.stage img.car{position:relative;width:100%;max-width:560px;filter:drop-shadow(0 30px 30px rgba(0,0,0,.45))}
.stage img.car{object-fit:contain;max-height:100%}
.float{position:absolute;background:rgba(28,31,36,.86);backdrop-filter:blur(10px);border:1px solid var(--line2);border-radius:18px;padding:10px 14px;font-size:13px;color:var(--muted);box-shadow:0 12px 30px rgba(0,0,0,.3)}
.float b{display:block;color:var(--text);font-size:15px}
.float.f1{top:8%;inset-inline-start:2%}.float.f2{bottom:6%;inset-inline-end:2%}
.float.f2 b{color:var(--accent)}

/* search */
.search{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:14px;display:grid;gap:10px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
@media(min-width:960px){.search{grid-template-columns:1.2fr 1fr 1fr auto;align-items:end;padding:16px 18px 10px}.search.diff{grid-template-columns:minmax(0,.85fr) minmax(0,.85fr) minmax(0,1.25fr) minmax(0,1.25fr) auto}.search .check.full{order:10}.search .err-line{order:11}}
.check.full{grid-column:1/-1}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-inline-start:4px}
html[lang=ar] .field>span{letter-spacing:0}
.ctrl{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:0 12px;height:52px;min-width:0;transition:border-color .2s}
.ctrl:focus-within{border-color:var(--accent)}
.ctrl .ico{color:var(--accent)}
.ctrl select,.ctrl input{background:none;border:0;outline:0;min-width:0;flex:1;height:100%;font-weight:600;font-size:15px;appearance:none;-webkit-appearance:none}
.ctrl select option{background:#1c1f24;color:#f2f4f6}
.ctrl input[type=date]{min-width:0}
.ctrl .t{flex:0 0 68px;border-inline-start:1px solid var(--line);padding-inline-start:10px;text-align:center}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none;padding:4px}
.check input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;transition:.15s;background:var(--bg2)}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"";width:10px;height:6px;border:2.5px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.btn{height:52px;padding:0 24px;border-radius:99px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap}
.btn.mint{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 30px rgba(46,230,166,.28)}
.btn.mint:hover{box-shadow:0 12px 36px rgba(46,230,166,.45);transform:translateY(-1px)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--line2)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.wide{width:100%}
.err-line{color:var(--danger);font-size:14px;font-weight:600;min-height:0}
.err-line:empty{display:none}

/* usp */
.usp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0 0}
@media(min-width:960px){.usp{grid-template-columns:repeat(4,1fr)}}
.usp div{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--bg2);border:1px solid var(--line);font-weight:700;font-size:14px;line-height:1.3}
.usp i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}

/* sections */
section.block{padding:56px 0 8px;scroll-margin-top:70px}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}
.head h2{font-size:clamp(28px,4.4vw,40px);letter-spacing:-.03em;line-height:1.1;font-weight:800}
html[lang=ar] .head h2{letter-spacing:0}
.head p{color:var(--muted);margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 18px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--muted);transition:.2s;display:flex;align-items:center;gap:8px}
.chip:hover{color:var(--text)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.tog.on{background:var(--text);color:var(--ink);border-color:var(--text)}

/* fleet cards */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.card{background:var(--card);color:var(--ink);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;position:relative;cursor:pointer;transition:transform .25s,box-shadow .25s;text-align:start}
.card:hover{transform:translateY(-4px);box-shadow:0 24px 50px rgba(0,0,0,.4)}
.card.off{opacity:.62}
.card .row1{display:flex;align-items:center;gap:6px;min-height:28px}
.tag{font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--card2);color:var(--ink-muted)}
.tag.feat{background:var(--ink);color:var(--accent)}
.avail{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#0d8a5f}
.avail i{width:8px;height:8px;border-radius:50%;background:#16c784}
.avail.no{color:#c2403e}.avail.no i{background:#e5484d}
.card .pic{aspect-ratio:2.35;display:grid;place-items:center;margin:4px -6px}
.card .pic,.car-stage .pic{position:relative;min-height:0}
.card .pic img,.car-stage .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.card .pic svg,.card .pic img{width:100%;height:100%;object-fit:contain;transition:transform .35s}
.card:hover .pic svg,.card:hover .pic img{transform:scale(1.04)}
.card h3{font-size:20px;letter-spacing:-.02em;line-height:1.2;font-weight:800}
html[lang=ar] .card h3{letter-spacing:0}
.card .yr{color:var(--ink-muted);font-size:14px;font-weight:600}
.specs{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 6px;color:var(--ink-muted);font-size:13px;font-weight:600}
.specs span{display:flex;align-items:center;gap:6px}
.specs .ico{width:16px;height:16px}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid rgba(0,0,0,.07)}
.price small{display:block;color:var(--ink-muted);font-size:12px;font-weight:600}
.price b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.price b span{font-size:14px;color:var(--ink-muted);font-weight:600;letter-spacing:0}
.go{height:48px;padding:0 6px 0 18px;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px;flex:none}
html[dir=rtl] .go{padding:0 18px 0 6px}
.go i{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
html[dir=rtl] .go i svg,html[dir=rtl] .flip{transform:scaleX(-1)}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--bg2);border-radius:var(--r);border:1px dashed var(--line2)}

/* how */
.steps3{display:grid;gap:14px}
@media(min-width:860px){.steps3{grid-template-columns:repeat(3,1fr)}}
.st{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:24px;position:relative;overflow:hidden}
.st .n{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:18px;margin-bottom:16px;box-shadow:0 0 26px rgba(46,230,166,.35)}
.st h3{font-size:19px;margin-bottom:6px}
.st p{color:var(--muted)}

/* terms */
.terms{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.term{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;gap:14px}
.term i{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.term b{display:block;margin-bottom:2px}
.term p{color:var(--muted);font-size:14px}
.locs{display:grid;gap:10px;margin-top:22px}
@media(min-width:860px){.locs{grid-template-columns:repeat(3,1fr)}}
.loc{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:22px;background:var(--bg2);border:1px solid var(--line)}
.loc i{color:var(--accent)}
.loc div{flex:1;min-width:0}
.loc small{color:var(--muted);display:block;font-size:13px}
.loc em{font-style:normal;font-weight:800;font-size:13px;padding:6px 10px;border-radius:99px;background:var(--panel2);white-space:nowrap}
.loc em.free{color:var(--accent);background:var(--accent-soft)}

/* faq */
.faq{display:grid;gap:10px;max-width:860px}
.faq details{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:0 20px;transition:border-color .2s}
.faq details[open]{border-color:rgba(46,230,166,.35)}
.faq summary{list-style:none;cursor:pointer;padding:18px 0;font-weight:700;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary i{width:30px;height:30px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;flex:none;transition:transform .25s}
.faq details[open] summary i{transform:rotate(45deg);background:var(--accent);color:var(--accent-ink)}
.faq details p{color:var(--muted);padding:0 0 18px}

/* contact + footer */
.contact{display:grid;gap:16px;background:linear-gradient(135deg,#1d2a25,#16191d 55%);border:1px solid var(--line);border-radius:32px;padding:26px;position:relative;overflow:hidden}
.contact::after{content:"";position:absolute;inset:auto -80px -120px auto;width:300px;height:300px;background:radial-gradient(closest-side,rgba(46,230,166,.22),transparent)}
@media(min-width:860px){.contact{grid-template-columns:1.2fr 1fr;padding:40px}}
.contact h2{font-size:clamp(28px,4.4vw,40px);letter-spacing:-.03em;line-height:1.1}
.contact .lines{display:grid;gap:12px;margin-top:16px;color:var(--muted)}
.contact .lines div{display:flex;gap:12px;align-items:center}
.contact .lines .ico{color:var(--accent)}
.contact .acts{display:flex;flex-wrap:wrap;gap:10px;align-content:center;position:relative;z-index:1}
footer{padding:36px 0 110px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
footer a b{color:var(--accent)}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.fab svg{width:28px;height:28px}

/* language gate */
.gate{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 30%,#1b2a24,var(--bg) 60%);display:grid;place-items:center;padding:20px}
.gate .box{width:min(440px,100%);text-align:center}
.gate .logo{justify-content:center;font-size:22px;margin-bottom:28px}
.gate .logo b{width:54px;height:54px;font-size:26px;border-radius:18px}
.gate h1{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:16px}
.gate .langs{display:grid;gap:10px}
.gate button{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px;padding:0 22px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:18px;font-weight:700;transition:.2s}
.gate button:hover{border-color:var(--accent);background:var(--panel2);transform:translateY(-1px)}
.gate button small{color:var(--muted);font-weight:500;font-size:14px}
.gate button[lang=ar]{font-family:"Tajawal",sans-serif;direction:rtl}

/* language menu */
.menu{position:absolute;top:60px;inset-inline-end:16px;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:6px;display:grid;min-width:180px;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:50}
.menu button{padding:12px 14px;border-radius:12px;text-align:start;font-weight:600}
.menu button:hover,.menu button.on{background:var(--panel2)}
.menu button.on{color:var(--accent)}

/* booking panel */
.ov{position:fixed;inset:0;z-index:60;background:rgba(5,6,8,.6);backdrop-filter:blur(4px);opacity:0;transition:opacity .25s}
.ov.in{opacity:1}
.sheet{position:fixed;z-index:61;inset:0;background:var(--bg2);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.in{transform:none}
@media(min-width:760px){.sheet{inset:12px;inset-inline-start:auto;width:600px;border-radius:30px;border:1px solid var(--line);transform:translateX(110%)}html[dir=rtl] .sheet{transform:translateX(-110%)}.sheet.in,html[dir=rtl] .sheet.in{transform:none}}
.sheet .scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 24px}
@media(min-width:760px){.sheet .scroll{padding:20px 24px 28px}}
.sh-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh-top h2{font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car-stage{background:var(--card);border-radius:26px;padding:16px 20px 8px;position:relative}
.car-stage .pic{aspect-ratio:2.4;display:grid;place-items:center}
.car-stage .pic svg,.car-stage .pic img{width:100%;height:100%;object-fit:contain}
.car-stage .t{color:var(--ink);display:flex;justify-content:space-between;align-items:end;gap:10px;padding-bottom:8px}
.car-stage h3{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.car-stage .yr{color:var(--ink-muted);font-weight:600;font-size:14px}
.car-stage .price b{color:var(--ink);white-space:nowrap}
@media(max-width:480px){.car-stage h3{font-size:20px}.car-stage .price b{font-size:20px}}
.stepper{display:flex;gap:6px;margin:18px 0 6px}
.stepper div{flex:1;display:grid;gap:7px;font-size:12px;font-weight:700;color:var(--muted)}
.stepper div::before{content:"";height:4px;border-radius:4px;background:var(--panel2)}
.stepper div.on{color:var(--text)}
.stepper div.on::before{background:var(--accent);box-shadow:0 0 12px rgba(46,230,166,.5)}
.sec{margin-top:20px}
.sec>h4{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.desc{color:var(--muted);margin-top:16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:480px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:4px;min-width:0}
.tile .ico{color:var(--accent)}
.tile small{color:var(--muted);font-size:12px;font-weight:600}
.tile b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiers div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.tiers small{color:var(--muted);font-size:12px;font-weight:600;display:block}
.tiers b{font-size:17px}
.tiers div.on{border-color:var(--accent);background:var(--accent-soft)}
.form2{display:grid;gap:10px}
@media(min-width:520px){.form2.two{grid-template-columns:1fr 1fr}}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:800;text-transform:capitalize}
.cal-h .round{width:36px;height:36px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-g .wd{font-size:11px;color:var(--muted);font-weight:700;padding:4px 0;text-transform:uppercase}
.cal-g button{height:42px;border-radius:12px;font-weight:700;font-size:14px;position:relative;transition:background .15s}
.cal-g button:hover:not(:disabled){background:var(--panel2)}
.cal-g button:disabled{color:rgba(255,255,255,.22);cursor:default}
.cal-g button.busy{color:#ff8f8f;background:rgba(229,72,77,.12);text-decoration:line-through}
.cal-g button.part{background:linear-gradient(135deg,rgba(229,72,77,.18) 50%,transparent 50%)}
.cal-g button.in{background:var(--accent-soft);border-radius:4px;color:var(--accent)}
.cal-g button.s,.cal-g button.e{background:var(--accent);color:var(--accent-ink);border-radius:12px}
.cal-g button.today::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.bill{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:9px}
.bill .ln{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.bill .ln b{color:var(--text);font-weight:700;white-space:nowrap}
.bill .tot{border-top:1px dashed var(--line2);padding-top:11px;margin-top:2px;font-size:18px;font-weight:800;color:var(--text)}
.bill .tot b{color:var(--accent);font-size:22px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);padding:12px 14px;border-radius:16px;background:var(--accent-soft)}
.note .ico{color:var(--accent);margin-top:1px}
.warn{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700;color:#ffb4b4;padding:12px 14px;border-radius:16px;background:rgba(229,72,77,.13)}
.extra{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:.2s;text-align:start;width:100%}
.extra:hover{border-color:var(--line2)}
.extra.on{border-color:var(--accent);background:var(--accent-soft)}
.extra i.box{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none}
.extra.on i.box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.extra div{flex:1;min-width:0}
.extra small{display:block;color:var(--muted);font-size:13px}
.extra b{white-space:nowrap}
.inp{width:100%;height:52px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0 14px;font-weight:600;outline:0;transition:border-color .2s}
textarea.inp{height:90px;padding:12px 14px;resize:vertical}
.inp:focus{border-color:var(--accent)}
.inp.bad{border-color:var(--danger)}
label.f{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
label.f em{font-style:normal;font-weight:500;opacity:.8}
.ups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up{position:relative;aspect-ratio:1.55;border-radius:20px;border:1.5px dashed var(--line2);background:var(--panel);display:grid;place-items:center;text-align:center;overflow:hidden;cursor:pointer;transition:border-color .2s}
.up:hover{border-color:var(--accent)}
.up.bad{border-color:var(--danger)}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.up .ph{display:grid;gap:6px;justify-items:center;padding:8px;font-size:13px;font-weight:700;color:var(--muted);pointer-events:none}
.up .ph .ico{width:26px;height:26px;color:var(--accent)}
.up img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.up .pdf{font-weight:800;color:var(--accent);pointer-events:none}
.up .chg{position:absolute;bottom:8px;inset-inline-start:8px;background:rgba(0,0,0,.65);font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;pointer-events:none}
.rev{display:grid;gap:10px}
.rev div{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.rev small{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
html[lang=ar] .rev small{letter-spacing:0}
.rev p{font-weight:600;margin-top:2px}
.bar{border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;background:var(--bg2)}
@media(min-width:760px){.bar{padding:14px 24px;border-radius:0 0 30px 30px}}
.bar .sum{flex:1;min-width:0}
.bar .sum small{display:block;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sum b{font-size:22px;font-weight:800}
.bar .btn{height:50px}
.done{text-align:center;padding:30px 6px}
.done .ok{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 20px;box-shadow:0 0 50px rgba(46,230,166,.5)}
.done .ok .ico{width:40px;height:40px;stroke-width:2.6}
.done h3{font-size:26px;margin-bottom:8px}
.done p{color:var(--muted);max-width:420px;margin:0 auto}
.done .ref{display:inline-block;margin:20px 0;padding:14px 24px;border-radius:20px;background:var(--panel);border:1px solid var(--line2)}
.done .ref small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.done .ref b{font-size:28px;letter-spacing:.12em;color:var(--accent)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.skel{height:420px;border-radius:var(--r);background:linear-gradient(90deg,var(--panel),var(--panel2),var(--panel));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.reveal.vis{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"><div class="wrap" style="padding-top:80px"><div class="skel"></div></div></div>
<script type="module" src="/rent/app.js"></script>
</body>
</html>
